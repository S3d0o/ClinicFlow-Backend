services:

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: clinicflow-db
    restart: unless-stopped
    environment:
      SA_PASSWORD: ${DB_PASSWORD}
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "127.0.0.1:1433:1433" # host-only; the backend reaches SQL Server over the compose network
    volumes:
      - clinicflow_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ${DB_PASSWORD} -Q 'SELECT 1' -C"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # One-shot: creates the database and the app's own login (docker/db-init.sql), so the backend
  # doesn't connect as sa (REVIEW.md NM6). Uses sqlcmd from the SQL Server image.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: clinicflow-db-init
    depends_on:
      db:
        condition: service_healthy
    environment:
      SQLCMDPASSWORD: ${DB_PASSWORD}
      APP_LOGIN: clinicflow_app
      APP_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env (see .env.example)}
    volumes:
      - ./docker/db-init.sql:/db-init.sql:ro
    # The healthcheck passes before SQL Server has brought an existing database online, and the script
    # then fails with error 904 ("cannot be autostarted during server startup"). The script is
    # idempotent, so retry it for up to a minute ($$ escapes $ from compose interpolation)
    entrypoint:
      - /bin/bash
      - -c
      - |
        for attempt in $$(seq 1 30); do
          /opt/mssql-tools18/bin/sqlcmd -S db -U sa -C -b -i /db-init.sql && exit 0
          echo "db-init: SQL Server is not ready yet (attempt $$attempt of 30), retrying in 2 s"
          sleep 2
        done
        exit 1
    restart: "no"

  backend:
    image: clinicflow-backend
    container_name: clinicflow-backend
    # Safety net: startup already retries while SQL Server recovers (DataSeeder.MigrateWithRetryAsync)
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__DefaultConnection: "Server=db;Database=ClinicFlow;User Id=clinicflow_app;Password=${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env (see .env.example)};MultipleActiveResultSets=true;TrustServerCertificate=True"
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      JwtSettings__Secret: ${JWT_SECRET}
      JwtSettings__Issuer: "http://backend:8080"
      JwtSettings__Audience: "http://localhost:3000"
      JwtSettings__AccessTokenExpirationMinutes: "15"
      JwtSettings__RefreshTokenExpirationDays: "7"
      JwtSettings__TheftDetectionWindowMinutes: "5"
      EmailSettings__Username: ${EMAIL_USERNAME}
      EmailSettings__Password: ${EMAIL_PASSWORD}
      EmailSettings__FromAddress: ${EMAIL_FROM_ADDRESS}
      # Optional: creates a real admin on first start (demo accounts are not seeded in Production)
      Seeding__AdminEmail: ${ADMIN_EMAIL:-}
      Seeding__AdminPassword: ${ADMIN_PASSWORD:-}
      # Local demos only: SEED_DEMO_DATA=true loads the demo clinic (published passwords). Never on a real deployment
      Seeding__DemoData: ${SEED_DEMO_DATA:-false}
    ports:
      - "5001:8080"

  frontend:
    image: clinicflow-frontend
    container_name: clinicflow-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  clinicflow_data: